name: Cask validation

on:
  push:
    branches:
      - main
    paths:
      - 'Casks/**/*.rb'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'Casks/**/*.rb'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  validate-casks:
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          stable: true

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-26-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-26-rubygems-

      - name: Check cask style
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew style --cask "${TAP_NAME}/x-media-assist"

      - name: Audit cask definition
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew audit --cask --skip-style --except=installed "${TAP_NAME}/x-media-assist"

      - name: Verify release download and checksum
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew fetch --cask --retry "${TAP_NAME}/x-media-assist"

      - name: Verify cask installation
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew install --cask "${TAP_NAME}/x-media-assist"
